# MediFlow — Configuração Nginx Reverse Proxy & SPA Server
# Porta 80 única:
#   /           -> Portal Web Corporativo (React SPA)
#   /api/, /docs -> API REST FastAPI (Swagger + Endpoints v1)
#   /streamlit/ -> Bancada Streamlit (HiTL)

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Limite de corpo para upload de arquivos (15MB suporta o limite de 10MB + metadados multipart)
    client_max_body_size 15M;

    # Suporte a WebSockets para a interface reativa do Streamlit
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream api_service {
        server mediflow-api:8000;
        keepalive 32;
    }

    upstream streamlit_service {
        server mediflow-streamlit:8501;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Compressão Gzip para aceleração de carregamento
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

        # -------------------------------------------------------------
        # 1. API REST FastAPI (/api, /docs, /openapi.json, /redoc)
        # -------------------------------------------------------------
        location /api/ {
            proxy_pass http://api_service/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location = /docs {
            proxy_pass http://api_service/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /docs/ {
            proxy_pass http://api_service/docs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /openapi.json {
            proxy_pass http://api_service/openapi.json;
            proxy_set_header Host $host;
        }

        location = /redoc {
            proxy_pass http://api_service/redoc;
            proxy_set_header Host $host;
        }

        # -------------------------------------------------------------
        # 2. Bancada Streamlit (HiTL) em /streamlit/ com WebSockets
        # -------------------------------------------------------------
        location = /streamlit {
            return 301 /streamlit/;
        }

        location /streamlit/ {
            proxy_pass http://streamlit_service/streamlit/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # -------------------------------------------------------------
        # 3. Raiz da Aplicação: Portal Web React SPA
        # -------------------------------------------------------------
        root /usr/share/nginx/html;
        index index.html;

        location /assets/ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
